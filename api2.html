<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumir API</title>
    <link rel="stylesheet" href="./css/api_style.css">
</head>
<body>
    <div class="container">
        <h1>Frases Motivacionais</h1>
        <ul id="lista"></ul>
    </div>
    <script>
        fetch("http://localhost/PRETCC/api2.php") 
            .then(res=>res.json())
            .then(dados=>{
                const lista = document.getElementById("lista");
                dados.forEach(frase=>{ 
                    const li = document.createElement("li");
                    li.textContent = "ID: " + frase.id + 
                                       " | Frase: " + frase.frase + 
                                       " | Autor: " + frase.autor; 
                    lista.appendChild(li);
                });
            })
            .catch(err=>console.error("Erro na API:",err));
    </script>
</body>
</html>
