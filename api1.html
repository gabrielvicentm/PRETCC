<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumir API</title>
</head>
<body>
    <h1>Exercícios de academia</h1>
    <ul id="lista"></ul>
    <script>
        fetch("http://localhost/pretcc-main/apis/api1.php")
            .then(res=>res.json())
            .then(dados=>{
                const lista = document.getElementById("lista");
                dados.forEach(exercicio=>{
                    const li = document.createElement("li");
                    li.textContent = "ID: " + exercicio.id + 
                                       " | Nome: " + exercicio.nome + 
                                       " | Músculo: " + exercicio.musculo + 
                                       " | Equipamento: " + exercicio.equipamento;
                    lista.appendChild(li);
                });
            })
            .catch(err=>console.error("Erro na API:",err));
    </script>
</body>
</html>
